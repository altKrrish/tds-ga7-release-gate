name: TDS GA7 Release Gate

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-release-gate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install fastapi uvicorn

      - name: "TDS identity: 24f3005189@ds.study.iitm.ac.in"
        run: |
          echo "Identity verified: 24f3005189@ds.study.iitm.ac.in"

      - name: Run Release Gate Policy Tests
        run: |
          python -m unittest test_gate.py
